    <style type="text/tailwindcss">
      @layer base {
        .markdown-body h2 {
          @apply text-2xl font-bold text-slate-900 mt-8 mb-4 pb-2 border-b border-slate-100;
        }
        .markdown-body h3 {
          @apply text-xl font-bold text-slate-800 mt-6 mb-3;
        }
        .markdown-body p {
          @apply text-slate-700 leading-relaxed mb-4;
        }
        .markdown-body ul {
          @apply list-disc ml-6 mb-4 space-y-2;
        }
        .markdown-body li {
          @apply text-slate-700;
        }
        .markdown-body blockquote {
          @apply bg-blue-50 border-l-4 border-blue-500 p-4 my-6 italic text-blue-900;
        }
        .markdown-body strong {
          @apply font-bold text-slate-900;
        }
      }
